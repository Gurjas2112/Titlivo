[project]
name = "titlivo"
version = "0.1.0"
description = "Titlivo API: one canonical parcel API across Indian states, with Title Passports"
readme = "README.md"
authors = [
    { name = "Gurjas Gandhi", email = "gurjasgandhi76@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "indic-transliteration>=2.3.82",
    "joserfc>=1.7.7",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "rapidfuzz>=3.14.6",
    "scalar-fastapi>=1.9.1",
    "shapely>=2.2.0",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
